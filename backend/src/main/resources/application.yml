spring:
  datasource:
    url: jdbc:mysql://localhost:3306/grouppay?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  session:
    store-type: none

server:
  port: 8080
  servlet:
    session:
      timeout: 3600  # 1시간 (초 단위)
